services:
  loto:
    build: .
    image: loto-drill:latest
    container_name: loto-drill
    command: sh -c "npm run init-db && node server.js"
    ports:
      - "${LOTO_PORT:-3000}:3000"
    environment:
      # 容器内监听端口(左侧宿主机端口由 LOTO_PORT 控制)
      PORT: "3000"
      # SQLite 数据库文件路径(已挂载到宿主机, 持久化)
      LOTO_DB: "/app/data/loto.db"
    volumes:
      - loto-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 8s

volumes:
  loto-data:
